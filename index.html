<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon_x32.png">
<link rel="icon" type="image/png" sizes="64x64" href="icons/icon_x64.png">
<link rel="apple-touch-icon" href="icons/icon_x256.png">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0c0c0c">
<title>CROW NEST</title>
<link rel="stylesheet" href="account.css?v=2026-11-11-r1">
<script src="server-config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Alegreya:wght@500;600;700;800&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --fs:18px;
  --shell:#161616; --panel:#0e0e0e; --panel2:#1a1a1a; --line:#2c2c2c; --line2:#474747;
  --text:#e9e7e3; --muted:#a6a39e; --faint:#77746f;
  --accent:#e9e7e3; --accent-ink:#121212; --danger:#9b3b39; --danger-ink:#fff; --bad:#d58a84; --link:#f4f2ee; --ok:#bdbab4; --warn:#bdbab4;
  --paper:#e9e7e3; --paper2:#d8d5cf; --ink:#121212; --ink-muted:#55524d; --paper-line:#b9b5ad;
  --sel:#e9e7e3; --shadow:0 6px 22px rgba(0,0,0,.6);
  --body:'Atkinson Hyperlegible',system-ui,sans-serif; --display:'Alegreya',Georgia,serif;
  --r:12px;
  --bar:#000; --bar2:#1c1c1c; --barline:#383838; --barink:#e9e7e3;
}
:root{color-scheme:dark}:root[data-theme=light]{color-scheme:light}
:root[data-theme=light]{--accent:#1c1c1c;--accent-ink:#f3f2ef;--danger:#a3322f;--bad:#9a2f2b;--shell:#d6d4cf;--panel:#f3f2ef;--panel2:#e6e4df;--line:#c3c0b9;--line2:#9e9a92;--text:#111;--muted:#46443f;--faint:#67645e;--link:#111;--sel:#1c1c1c;--ok:#46443f;--warn:#46443f;--shadow:0 6px 20px rgba(0,0,0,.18)}
:root[data-theme=contrast]{--accent-ink:#000;--shell:#000;--panel:#000;--panel2:#0b0b0b;--line:#fff;--line2:#fff;--text:#fff;--muted:#fff;--faint:#ddd;--accent:#fff;--danger:#ff3b3b;--danger-ink:#000;--bad:#ff6b6b;--link:#fff;--sel:#fff;--ok:#fff;--warn:#fff;--paper:#fff;--paper2:#fff;--ink:#000;--ink-muted:#000;--paper-line:#000}
:root[data-font=system]{--body:system-ui,sans-serif;--display:system-ui,sans-serif}
*{box-sizing:border-box}
html{font-size:var(--fs)}
body{margin:0;background:var(--shell);color:var(--text);font:1rem/1.5 var(--body);-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--link);text-underline-offset:3px;text-decoration-color:var(--faint)}
:focus-visible{outline:3px solid var(--sel);outline-offset:2px}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0}
.muted{color:var(--muted)} .small{font-size:.85rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- top bar ---------- */
#top{position:sticky;top:0;z-index:30;background:var(--bar);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:.75rem;padding:.5rem 1rem;flex-wrap:wrap}
:root[data-theme=light] #top{background:#111;color:#e9e7e3}
.brand{font-family:var(--display);font-weight:800;font-size:1.25rem;letter-spacing:.06em;color:var(--barink);display:flex;align-items:center;gap:.5rem}
.brand svg{width:26px;height:26px}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--bar2);border:1px solid var(--barline);border-radius:999px;padding:3px}
.seg button{border:0;background:none;color:#cfccc6;padding:.35rem .9rem;border-radius:999px;font-weight:700;min-height:40px}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.spacer{flex:1}
.tbtn{background:var(--bar2);border:1px solid var(--barline);color:var(--barink);border-radius:10px;padding:.35rem .8rem;min-height:44px;display:inline-flex;align-items:center;gap:.4rem;font-weight:700}
.tbtn:hover{border-color:#777}
.dtchip{display:inline-flex;align-items:center;gap:.5rem;background:var(--bar2);border:1px solid var(--barline);border-radius:10px;padding:.3rem .7rem;color:var(--barink);min-height:44px}
.dtchip b{font-family:var(--display);font-size:1.15rem}
.dtchip .bar{width:70px;height:6px;border-radius:3px;background:var(--barline);overflow:hidden}
.dtchip .bar i{display:block;height:100%;background:var(--warn)}
.dtchip.idle{opacity:.7}
#tabs .tl{display:flex;gap:.25rem}
#tabs .tl button{border:1px solid transparent;background:none;color:var(--muted);padding:.5rem 1rem;border-radius:10px 10px 0 0;font-weight:700;min-height:44px}
#tabs .tl button[aria-selected=true]{background:var(--panel);color:var(--text);border-color:var(--line);border-bottom-color:var(--panel)}
main{max-width:1500px;margin:0 auto;padding:0 1rem 4rem}
.page{background:var(--panel);border:1px solid var(--line);border-radius:0 var(--r) var(--r) var(--r);padding:1.25rem}

/* ---------- generic blocks (Forge Steel-like) ---------- */
.box{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:1rem}
.box>h2,.sec-h{font-size:1.2rem;letter-spacing:.04em;text-transform:uppercase;font-family:var(--display);padding-bottom:.4rem;margin-bottom:.75rem;border-bottom:3px solid var(--line2)}
.sec-h{display:flex;align-items:baseline;gap:.75rem;flex-wrap:wrap}
.sec-h .muted{text-transform:none;letter-spacing:0;font-family:var(--body);font-size:.85rem;font-weight:400}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1rem}
.cols{display:grid;grid-template-columns:minmax(0,2fr) minmax(280px,1fr);gap:1rem;align-items:start}
@media (max-width:980px){.cols,.grid2{grid-template-columns:1fr}}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(6.5rem,1fr));gap:.5rem}
.tile{background:#070707;border:1px solid var(--line);border-radius:10px;padding:.45rem .6rem;text-align:center;min-height:72px;display:flex;flex-direction:column;justify-content:flex-start;align-items:center}
:root[data-theme=light] .tile{background:#fff}
.tile .k{margin-bottom:.35rem;font-size:.78rem;color:var(--muted);font-weight:700;letter-spacing:.03em}
.tile .v{font-family:var(--display);font-size:1.6rem;font-weight:800;line-height:1.1}
.tile .v small{font-size:.9rem;color:var(--muted);font-weight:500}
.tile.warn{border-color:var(--warn)} .tile.bad{border-color:var(--danger)}
.tile.btn{cursor:pointer} .tile.btn:hover{border-color:var(--line2)}
.stepper{display:inline-flex;align-items:center;gap:.25rem}
.stepper button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line2);background:var(--panel);font-weight:800;line-height:1}
.chips{display:flex;flex-wrap:wrap;gap:.35rem}
.chip{display:inline-flex;align-items:center;gap:.3rem;background:#2a2a2a;color:#e9e7e3;border-radius:6px;padding:.1rem .5rem;font-size:.85rem;font-weight:700}
:root[data-theme=light] .chip{background:#d6d3cd;color:#121212}
.chip.on{background:var(--accent);color:var(--accent-ink)}
.chip button{border:0;background:none;padding:0 .1rem;font-weight:800}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;border:1px solid var(--line2);background:var(--panel2);border-radius:10px;padding:.45rem .9rem;min-height:44px;font-weight:700;text-decoration:none;color:var(--text)}
.btn:hover{border-color:var(--text)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none}
.btn.danger{background:none;border-color:color-mix(in srgb,var(--danger) 70%,var(--line2));color:var(--bad)}.btn.danger:hover{background:var(--danger);border-color:var(--danger);color:var(--danger-ink)}
.btn.danger.solid,#dlg .btn.danger[value=ok]{background:var(--danger);border-color:var(--danger);color:var(--danger-ink)}
.tbtn.danger{color:#e0928c}.tbtn.danger:hover{color:#fff;background:var(--danger)}
.row>.btn.danger:last-child{margin-left:auto}.tsep{width:1px;align-self:stretch;margin:.55rem .6rem;background:var(--barline)}
@media (max-width:1100px){#acts .tbtn{padding-left:.5rem;padding-right:.5rem}.tsep{margin:.55rem .3rem}}
.btn.danger:disabled{background:none;color:var(--muted);border-color:var(--line2)}
.btn.sm{min-height:36px;padding:.25rem .65rem;font-size:.9rem}
.btn:disabled{opacity:.4;cursor:not-allowed;border-color:var(--line)}
.row{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:1rem}
input[type=number],input[type=text],input[type=search],select{background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:.4rem .6rem;min-height:44px}
input[type=number]{width:5.5rem}
/* every number field is [−] value [+]; the value stays typeable */
.numstep{display:inline-flex;align-items:stretch;flex:none;background:var(--panel);border:1px solid var(--line2);border-radius:10px;min-height:44px}
td.nw{white-space:nowrap}
td .numstep input[type=number]{width:2.6rem}td .stp{min-width:32px}
.row>select{max-width:100%;min-width:0}
.numstep:focus-within{border-color:var(--text)}
.numstep input[type=number]{border:0;background:none;border-radius:0;width:4rem;min-width:0;padding:.4rem .2rem;text-align:center;font-variant-numeric:lining-nums tabular-nums;appearance:textfield;-moz-appearance:textfield}
.numstep input::-webkit-inner-spin-button,.numstep input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.numstep input:focus-visible{outline:0}
.stp{border:0;background:none;min-width:40px;font-size:1.2rem;font-weight:700;line-height:1;color:var(--muted);cursor:pointer;border-radius:9px}
.stp:hover{color:var(--text);background:var(--panel2)}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent)}
label.check{display:inline-flex;align-items:center;gap:.5rem;min-height:44px;cursor:pointer}
.trait{margin:.35rem 0}.trait b{font-weight:700}
.note{border-left:4px solid var(--line2);padding:.4rem .8rem;color:var(--muted);background:var(--panel2);border-radius:0 8px 8px 0}
table.rt{width:100%;border-collapse:collapse;margin:.5rem 0}
table.rt th,table.rt td{border-bottom:1px solid var(--line);padding:.4rem .5rem;text-align:left;vertical-align:top}
table.rt th{font-size:.85rem;color:var(--muted)}
table.rt tr.hit td{background:color-mix(in srgb,var(--sel) 22%,transparent);font-weight:700}
.term{color:inherit;text-decoration:underline dotted;text-decoration-color:var(--link);text-decoration-thickness:2px;text-underline-offset:4px;cursor:help}
.term:hover{color:var(--link)}

/* ---------- power roll table (Forge Steel style) ---------- */
.pr{border:1px solid var(--line2);border-radius:10px;overflow:hidden;margin:.5rem 0;background:var(--panel)}
.pr .h{padding:.4rem .75rem;font-weight:700;border-bottom:1px solid var(--line2);display:flex;gap:.6rem;align-items:baseline;flex-wrap:wrap}
.pr .h .muted{font-weight:400;font-size:.85rem}
.pr .r{display:grid;grid-template-columns:4.2rem 1fr;align-items:baseline}
.pr .r + .r{border-top:1px solid var(--line)}
.pr .t{padding:.4rem .6rem;font-weight:800;font-family:var(--display);font-size:1.05rem;border-right:1px solid var(--line2);text-align:center}
.pr .x{padding:.4rem .75rem}
.pr .x .dice{display:block;font-size:.8rem;color:var(--muted)}
.pr .r.on{background:color-mix(in srgb,var(--sel) 20%,transparent)}
.pr .r.on .t{color:var(--sel)}
.pr .r.dim{opacity:.45}

/* ---------- inventory board ---------- */
.slot{position:relative;min-height:15.5rem;padding-top:1.15rem;border:2px dashed var(--line2);border-radius:12px;background:rgba(0,0,0,.18);display:flex;flex-direction:column}
.slot .num{position:absolute;top:.1rem;left:.5rem;font-size:.75rem;color:var(--faint);font-weight:700;z-index:2}
.slot.empty{align-items:center;justify-content:center;color:var(--muted);cursor:pointer}
.slot.empty:hover{border-color:var(--text);color:var(--text)}
.slot.empty .plus{font-size:1.6rem;line-height:1}
.slot.target{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,transparent)}
.slot.drop-hover{outline:3px solid var(--ok);outline-offset:2px}
.slot.nope{opacity:.45}
.slot>.card.moving{outline:3px solid var(--ok);outline-offset:2px}
.slot.span{border-style:solid}
.slot.wounded{border-color:var(--danger)}
.slot .wbtn{margin:auto .35rem .35rem;border:1px solid var(--line2);background:var(--panel);border-radius:8px;font-size:.8rem;font-weight:700;min-height:34px;color:var(--muted)}
.slot .wbtn[aria-pressed=true]{background:var(--danger);border-color:var(--danger);color:var(--danger-ink)}
.slot .wbtn.pending{border-color:var(--danger);color:var(--text);animation:pulse 1s infinite alternate}
@keyframes pulse{to{box-shadow:0 0 0 4px color-mix(in srgb,var(--danger) 45%,transparent)}}
.cont{flex:1;display:flex;align-items:center;justify-content:center;padding:.5rem;color:var(--ink-muted);font-family:var(--display);font-weight:700;text-align:center;background:repeating-linear-gradient(135deg,transparent 0 8px,rgba(255,255,255,.04) 8px 16px);border-radius:10px;margin:.3rem}

/* ---------- item card (paper) ---------- */
.card{background:var(--paper);color:var(--ink);border-radius:10px;box-shadow:0 2px 0 var(--paper-line),0 3px 12px rgba(0,0,0,.35);padding:.55rem .65rem .5rem;display:flex;flex-direction:column;gap:.25rem;position:relative;font-size:.86rem;line-height:1.35;border-top:6px solid var(--cat,#8a7b62)}
.card a,.card .term{color:var(--ink)} .card .term{text-decoration-color:var(--ink-muted)}
.card .nm{font-family:var(--display);font-weight:800;font-size:1.08rem;line-height:1.15;padding-right:1.6rem}
.card .meta{display:flex;justify-content:space-between;gap:.4rem;background:var(--paper2);border-radius:5px;padding:.1rem .4rem;font-size:.78rem;font-weight:700}
.card .ln{font-size:.82rem}
.card .ln b{font-weight:700}
.card .q{font-style:italic}
.card .txt{overflow:hidden;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical}
.card.full .txt{display:block;-webkit-line-clamp:unset}
.card .tt{display:grid;border:1px solid var(--paper-line);border-radius:5px;overflow:hidden;font-size:.8rem;text-align:center}
.card .tt div{padding:.08rem .2rem}
.card .tt .th{background:var(--paper2);font-weight:800}
.card .price{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-size:.78rem;color:var(--ink-muted);font-weight:700;gap:.3rem}
.card .catl{font-size:.7rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted)}
.card .acts{display:flex;flex-wrap:wrap;gap:.25rem;margin-top:.15rem}
.card .acts button{border:1px solid var(--paper-line);background:#f6f5f2;color:var(--ink);border-radius:6px;font-size:.78rem;font-weight:700;min-height:30px;padding:0 .45rem}
.card .acts button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.card .pips{display:inline-flex;gap:3px;align-items:center}
.card .pip{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--ink);background:#fff;padding:0}
.card .pip.gone{background:transparent;border-style:dashed;opacity:.4}
.card .info{position:absolute;top:.35rem;right:.35rem;width:28px;height:28px;border-radius:50%;border:1px solid var(--paper-line);background:#f6f5f2;color:var(--ink);font-weight:800;font-family:var(--display);line-height:1}
.card .badge{position:absolute;top:-.55rem;left:.5rem;background:var(--ink);color:var(--paper);border-radius:6px;padding:0 .4rem;font-size:.72rem;font-weight:800}
.slot>.card{flex:1;margin:.25rem;cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none}
body.is-dragging,body.is-dragging *{-webkit-user-select:none;user-select:none;cursor:grabbing!important}
.slot>.card.lit{box-shadow:0 0 0 2px #f4f2ee,0 0 18px rgba(255,255,255,.35)}
.card.ghost{position:fixed;pointer-events:none;z-index:100;opacity:.92;transform:rotate(-2deg);width:12rem;box-shadow:var(--shadow)}
.card.dragging{opacity:.35}
.card{--cat:#141414}.c-weapon,.c-ammo{--cat:#141414}
#preview{position:fixed;z-index:60;width:20rem;pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s}
#preview.on{opacity:1;transform:none}
#preview .card{font-size:.95rem}

/* ---------- pool ---------- */
.pool{border:2px dashed var(--ok);border-radius:var(--r);padding:.75rem;min-height:8rem;background:color-mix(in srgb,var(--ok) 6%,transparent)}
.pool.drop-hover{outline:3px solid var(--ok)}
.pool h3{font-family:var(--body);font-size:.95rem;text-transform:uppercase;letter-spacing:.06em}
.prow{display:flex;gap:.5rem;align-items:center;padding:.45rem 0;border-top:1px solid var(--line)}
.prow .nm{flex:1;min-width:0}
.prow .nm b{display:block;font-family:var(--display);font-size:1.05rem}
.prow .nm span{font-size:.8rem;color:var(--muted)}
.xbtn{width:36px;height:36px;border-radius:8px;border:1px solid var(--line2);background:none;font-weight:800;color:var(--muted)}
.xbtn:hover{color:var(--text);border-color:var(--line2)}

/* ---------- banners, popovers, panel ---------- */
.banner{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;border:2px solid var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--panel));border-radius:var(--r);padding:.5rem .75rem;margin-bottom:.75rem}
.banner .msg{flex:1;min-width:12rem}
.banner.bad{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 14%,var(--panel))}
.pop{position:fixed;z-index:70;max-width:min(24rem,92vw);background:var(--panel);color:var(--text);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow);padding:.75rem .9rem;font-size:.95rem}
.pop h4{margin:0 0 .25rem;font-family:var(--display);font-size:1.1rem}
.pop .foot{margin-top:.5rem;display:flex;justify-content:space-between;gap:.5rem;align-items:center}
.pop .foot a{font-weight:700}
#searchPop{position:fixed;z-index:75;width:min(26rem,94vw);background:var(--panel);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow);padding:.6rem;display:none}
#searchPop.on{display:block}
#spl li button span{white-space:nowrap;max-width:none}
.combo input{width:100%}
.lb{list-style:none;margin:.4rem 0 0;padding:0;max-height:22rem;overflow:auto}
.lb .gh{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:.4rem .5rem .1rem;font-weight:700}
.lb li[role=option]{padding:.45rem .55rem;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;gap:.5rem}
.lb li[role=option] small{color:var(--muted)}
.lb li[aria-selected=true],.lb li[role=option]:hover{background:var(--panel2);outline:1px solid var(--line2)}
.lb mark{background:none;color:var(--link);font-weight:800}
#panel{position:fixed;top:0;right:0;bottom:0;width:min(31rem,100vw);background:var(--panel);border-left:1px solid var(--line2);z-index:50;transform:translateX(102%);transition:transform .2s;display:flex;flex-direction:column;box-shadow:var(--shadow)}
body.panel-open #panel{transform:none}
@media (min-width:1500px){body.panel-open main{margin-right:31rem}}
#panel .ph{display:flex;align-items:center;gap:.4rem;padding:.5rem;border-bottom:1px solid var(--line)}
#panel .ph h2{flex:1;font-size:1.15rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ibtn{width:44px;height:44px;border-radius:10px;border:1px solid var(--line2);background:var(--panel2);font-weight:800;font-size:1.1rem;display:inline-flex;align-items:center;justify-content:center;color:var(--text);text-decoration:none}
.ibtn:disabled{opacity:.3;cursor:not-allowed;background:none}
#panel .pb{padding:1rem;overflow:auto;flex:1}
.backlink{display:inline-flex;align-items:center;gap:.4rem;margin-bottom:.75rem;border:1px solid var(--line2);background:var(--panel2);border-radius:999px;padding:.3rem .8rem;font-weight:700;min-height:40px;color:var(--text)}
.rel{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.75rem}
.rel a{border:1px solid var(--line2);border-radius:999px;padding:.2rem .7rem;text-decoration:none;font-weight:700;font-size:.9rem}
.list-links{list-style:none;padding:0;margin:.25rem 0}
.list-links li{border-bottom:1px solid var(--line)}
.list-links a{display:flex;justify-content:space-between;padding:.45rem .25rem;text-decoration:none;font-weight:700}
.list-links a span{color:var(--muted);font-weight:400;font-size:.85rem}
#toast{position:fixed;left:50%;bottom:1.25rem;transform:translate(-50%,150%);background:var(--text);color:var(--panel);font-weight:700;padding:.65rem 1.1rem;border-radius:12px;z-index:90;transition:transform .2s;max-width:92vw}
#toast.on{transform:translate(-50%,0)}

/* sheet, one screen: XP strip / characteristics · expertises · traits / resources / damage */
.xpstrip{display:flex;align-items:center;gap:.75rem 1.25rem;flex-wrap:wrap;padding:.7rem 1rem;margin-bottom:.75rem}
.lvup{flex:1 1 100%;display:flex;align-items:center;justify-content:space-between;gap:.5rem 1rem;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:.6rem}
.lvup select{min-height:36px}
.page>.stack:has(.chbox){gap:.75rem}
.chbox,.dmgbox{padding:1rem 1.25rem}
.chbox .sec-h,.dmgbox .sec-h{margin-bottom:.6rem}
.xid{display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap}
.xid>.term{font-size:1.15rem;color:var(--text);text-decoration:none}
.xbar{flex:1 1 8rem;min-width:6rem}
.xbar>div{display:flex;justify-content:space-between;gap:1rem}
.xbar .hbar{margin:.3rem 0 0}
.xsp{display:flex;align-items:center;gap:.4rem;white-space:nowrap}
.xsp b,.xbar b{font-family:var(--num);font-variant-numeric:lining-nums tabular-nums}
.chbox{display:grid;grid-template-columns:minmax(13rem,19rem) minmax(0,1.15fr) minmax(0,1fr);gap:1.5rem;align-items:start}
.chbox .sec-h{margin-top:0;display:flex;align-items:baseline;gap:.75rem}
.sec-link{margin-left:auto;font-size:.85rem;font-weight:700;letter-spacing:0;text-transform:none;color:var(--text)}
.exrow{display:grid;grid-template-columns:6.5rem minmax(0,1fr);align-items:start;gap:.5rem;margin:.25rem 0}.exrow>.small{padding-top:.3rem}
.chips.sm{gap:.3rem}.chips.sm .chip{font-size:.85rem;min-height:30px;padding:.05rem .6rem}
.chnote{margin:.75rem 0 0;display:flex;flex-wrap:wrap;align-items:center;gap:.35rem}
.chconn{margin-top:.75rem;padding-top:.6rem;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:.35rem .5rem}.chconn>b{flex-basis:100%;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-size:.72rem}
.chip.mi{border:1px solid var(--bad);color:var(--bad);display:inline-flex;align-items:center;gap:.3rem;cursor:help}
.chip.mi .chx{border:0;background:none;color:inherit;font-size:.8rem;padding:0 .1rem;min-width:24px;min-height:24px;cursor:pointer}
.dmgbox{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:1.5rem;align-items:start}
.dmgbox .sec-h{margin-top:0}
.kpis.ch{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpis.ch .kpi{padding:.55rem .5rem .6rem}
.kpis.ch .kpi.hint{cursor:help}.kpis.ch .kpi.hint:hover .k,.kpis.ch .kpi.hint:focus-visible .k{color:var(--text)}
.kpis.res .kpi{padding:.6rem .5rem .65rem;gap:.3rem}
.kpi .kh{display:flex;align-items:center;justify-content:center;min-height:1.3rem}
.kpi .kl{position:relative;font-size:.72rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.kpi .kl .bonus{position:absolute;left:100%;top:50%;transform:translateY(-50%);margin-left:.4rem;letter-spacing:0;white-space:nowrap}
.kpis.res .kpi.hint{cursor:help}
.kpis.res .kpi.hint:hover .kl,.kpis.res .kpi.hint:focus-visible .kl{color:var(--text)}
.kpi .kh .bonus{font-family:var(--num);font-size:.75rem;font-weight:800;color:var(--text);background:none;border:1px solid var(--line2);border-radius:6px;padding:0 .3rem;line-height:1.35;cursor:help}
.kpis.res .v{gap:.9rem;align-items:center}
.kpis.res .v>span{display:inline-flex;align-items:baseline;gap:.25rem}
.kpi .st{width:32px;height:32px;flex:none;border-radius:8px;border:1px solid var(--line2);background:transparent;color:var(--text);font:700 1rem/1 var(--body);display:inline-flex;align-items:center;justify-content:center}
.kpi .st:hover{border-color:var(--text)}
@media (pointer:coarse){.kpi .st{width:40px;height:40px}}
@container (max-width:70em){.xid .xbg{display:none}}
@container (max-width:52em){.chbox{grid-template-columns:minmax(14rem,18rem) minmax(0,1fr)}.chbox>:last-child{grid-column:1/-1}}
@container (max-width:44em){.chbox,.dmgbox{grid-template-columns:1fr;gap:1rem}}
/* flex, not seven equal columns: the stepper cells get room, and a wrapped row never ends in an empty cell */
.kpis.k7.res{display:flex;flex-wrap:wrap}.kpis.res .kpi{flex:1 1 6.5rem}.kpis.res .kpi:has(.st){flex-basis:10rem}
.kpis.res .v>span{white-space:nowrap}
.slot{min-height:0;aspect-ratio:5/7}
/* a card spanning n slots: the slot is exactly as tall as its neighbours (one 5:7 column sets the height),
   the card keeps its own height instead of stretching into an empty sheet */
.wrow{display:flex;gap:.35rem;margin:auto .35rem .35rem}.wrow .wbtn{flex:1;margin:0}
/* actions tab: ability cards */
.abils{display:grid;grid-template-columns:repeat(auto-fill,minmax(19rem,1fr));gap:.75rem;margin-bottom:1.5rem;align-items:start}
.abil{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:.85rem}
.abil>header{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem}
.abil .pr{margin-top:.5rem}
.abil.off{opacity:.55}.abil .why{margin:.4rem 0 0;font-weight:700}
/* traits tab: the tree as in the book, lines drawn behind the cards */
.tscroll{overflow-x:auto;padding-bottom:.5rem}
@container (max-width:52em){.tnav{display:flex;overflow-x:auto;gap:.25rem}.tnav h3{display:none}.tnav button{width:auto;flex:none;white-space:nowrap;gap:.5rem}}
.ttree{position:relative;display:grid;gap:2.5rem 1.75rem}
.tlines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.tlines line{stroke:var(--line2);stroke-width:3;stroke-linecap:square}
.tnode{position:relative;z-index:1;background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:.7rem;display:flex;flex-direction:column;gap:.2rem}
.tnode>p{flex:1}
.tnode.own{border-color:var(--line2);background:color-mix(in srgb,var(--text) 8%,var(--panel2))}
.tnode.locked{color:var(--muted)}
/* pets */
.petslots{display:grid;grid-template-columns:repeat(auto-fill,minmax(9rem,1fr));gap:.6rem}
.sec-h.sm{margin-top:1rem}
.slot>.card{min-height:0;overflow:hidden}
.slot>.card .txt{-webkit-line-clamp:4}
@media (max-width:640px){.slot{aspect-ratio:auto;min-height:13rem}}
/* guided flow: Home role picker + checklist, the Now bar, phase-aware tabs */
.home{max-width:46rem;margin:0 auto}
.who{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,16rem),1fr));gap:.75rem;margin-bottom:1.25rem}
.who-c{padding:1.1rem 1.2rem;min-height:8rem}.who-c h3{font-size:1.5rem}
.hsteps>li{display:flex;align-items:center;gap:1rem}.hsteps>li>div{flex:1}.hsteps p{margin:.15rem 0 0;color:var(--muted)}.hsteps>li.done{opacity:.6}
.now{border-bottom:1px solid var(--line);padding:0 0 .75rem;margin-bottom:1rem}
.now .msg{flex:1;min-width:14rem;font-size:1.1rem}
.seg.phase{background:var(--panel2);border-color:var(--line)}.seg.phase button{color:var(--text)}
#tabs .tsep{width:1px;background:var(--line);margin:.6rem .5rem}
#tabs .tmore{color:var(--muted)}
.navg button[hidden]{display:none}
.flow{list-style:none;margin:.25rem 0 1rem;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;counter-reset:f}
.flow li{counter-increment:f;border-top:3px solid var(--line);padding:.4rem 0 0;display:flex;flex-direction:column;color:var(--muted)}
.flow li b::before{content:counter(f) '. '}.flow li span{font-size:.85rem}
.flow li.cur{border-color:var(--sel);color:var(--text)}.flow li.done{border-color:var(--ok)}
@media (max-width:640px){.flow{grid-template-columns:1fr}}
.intro{margin-bottom:1rem;border-color:var(--sel)}.intro .steps{margin-top:.5rem}

/* ---------- v4 polish: quiet chrome, plain zeros, one motion speed ---------- */
/* Atkinson's slashed zero reads as a strikethrough at display sizes (30:00, 0 / 2); numbers use Inter's plain figures. */
:root{--num:'Inter',var(--body);--ease:.15s ease;--r:14px}
:root[data-font=system]{--num:system-ui,sans-serif}
.tile .v,.pr .t,.roll,.clock,.dtchip b,.dtchip span,.dice6 button,.kpi .v,.numstep input,.stepper b,.pstats b,.receipt td:last-child{font-family:var(--num);font-variant-numeric:lining-nums tabular-nums;letter-spacing:-.01em}
.kpi .v{font-weight:600}.clock{font-weight:600}
.btn,.tbtn,.opt,.navg button,#tabs button,.bsteps button,.stp,.seg button,.xbtn,.ibtn,.slot.empty,.kpi .adj button,.lb li,.libnav button,.mlist li button{transition:background-color var(--ease),border-color var(--ease),color var(--ease),box-shadow var(--ease),opacity var(--ease)}
.btn:active,.tbtn:active,.opt:active{transform:translateY(1px)}
.btn.primary:hover{background:color-mix(in srgb,var(--accent) 86%,var(--panel));border-color:color-mix(in srgb,var(--accent) 86%,var(--panel))}.tbtn.primary:hover{background:#fff;border-color:#fff}

/* top bar: title + quiet text actions; a destructive action stays grey until hovered */
#top{min-height:3.5rem;padding:.4rem 1rem;background:color-mix(in srgb,var(--bar) 90%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
:root[data-theme=light] #top{background:color-mix(in srgb,#111 92%,transparent)}
#ptl{font-size:1.3rem;letter-spacing:.06em}
.tbtn{background:none;border-color:transparent;color:#bdbab4;min-height:40px}
.tbtn:hover{background:var(--bar2);border-color:var(--barline);color:var(--barink)}
.tbtn[data-action=crow-del]:hover{color:#e07a74;border-color:#5a2a28}
.dtchip{background:none;border-color:var(--barline);gap:.6rem;min-height:40px}
.dtchip .bar{height:4px}.dtchip .bar i{background:var(--barink)}
.dtchip .small{color:#a6a39e}

/* bottom bar: one dark surface; the current section is bone text with an accent line, not a white slab */
#nav{background:color-mix(in srgb,var(--bar) 92%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);padding:.3rem 1rem calc(.3rem + env(safe-area-inset-bottom))}
.navg,.navg.dark{background:none;border:0;padding:0;gap:.15rem}
.navg button,.navg.dark button{color:#a6a39e;border-radius:10px;padding:.3rem .8rem}
.navg button:hover,.navg.dark button:hover{background:#1c1c1c;color:#f4f2ee}
.navg button[aria-current=page]{background:#1c1c1c;color:#f4f2ee;box-shadow:inset 0 2px 0 var(--barink)}
.navg button img{width:26px;height:26px;opacity:.9}
/* every width: square-cornered cells, icon over label; the two groups stay in the bar's corners */
#nav{padding:0 0 env(safe-area-inset-bottom)}
.navg,.navg.dark{gap:0}
.navg button,.navg.dark button{flex-direction:column;justify-content:center;gap:.25rem;border-radius:0;min-height:60px;min-width:5.5rem;padding:.45rem .9rem;font-size:max(14px,.75rem);line-height:1.1;white-space:nowrap}
@container (max-width:48em){.navg button,.navg.dark button{font-size:max(14px,.75rem);gap:.25rem;min-width:0;padding:.45rem .6rem}}
@container (max-width:40em){
  #nav>.spacer{display:none}
  .navg,.navg.dark{flex:1 1 auto;display:flex}
  .navg button,.navg.dark button{flex:1;flex-direction:column;gap:.1rem;font-size:.6rem;padding:.3rem 0;min-height:52px;min-width:0;white-space:nowrap;line-height:1.1}
  .navg button>img{flex:none}
  /* phones: every section gets an equal, square-cornered cell across the whole bar */
  #nav{gap:0;padding:0 0 env(safe-area-inset-bottom)}.navg,.navg.dark{display:contents}
  .navg button,.navg.dark button{flex:1 1 0;border-radius:0;min-height:58px;padding:.5rem 0 .45rem;gap:.25rem;justify-content:center;font-size:.68rem}
  .navg button[aria-current=page]{box-shadow:inset 0 2px 0 var(--barink)}
  .navg svg,.navg img{width:22px;height:22px}
  /* one label size for every cell, scaled to the bar so seven Ref sections fit a 375px phone */
  .navg .lbl{display:block;max-width:100%;box-sizing:border-box;padding:0 2px;overflow:hidden;text-overflow:ellipsis;font-size:clamp(11px,3cqw,.68rem)}
  .navg .lbl[data-short]{font-size:0}.navg .lbl[data-short]::before{content:attr(data-short);content:attr(data-short) / "";font-size:clamp(11px,3cqw,.68rem)}
  #netbtn .lbl[data-n]::after{content:none}
  #netbtn[data-n]::after{content:attr(data-n);position:absolute;top:.3rem;left:calc(50% + 4px);min-width:1.1em;padding:0 .25em;border-radius:99px;background:var(--barink);color:var(--bar);font:700 11px/1.5 var(--body);text-align:center}
}
@media (max-width:640px){#nav{gap:0;padding:0 0 env(safe-area-inset-bottom)}
  /* the party's location folds to the current one; tap it to pick another, so the tabs keep the width */
  #tabs .seg.phase:not(.open):has(button[aria-pressed=true]) button[aria-pressed=false]{display:none}}

/* sub-tabs: one line that scrolls sideways on a phone instead of stacking into three rows */
/* one sticky bar: page tabs (and More) on the left, where the party is + Tips on the right */
#tabs{position:sticky;top:var(--th,62px);z-index:25;background:var(--shell);padding:.35rem 1rem 0}
#tabs .tbar{max-width:calc(1500px - 2rem);margin:0 auto;display:flex;align-items:center;gap:1rem;border-bottom:1px solid var(--line)}
#tabs .tl{flex:1 1 auto;min-width:0;align-self:stretch;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 2rem),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 2rem),transparent)}
#tabs .tl::-webkit-scrollbar{display:none}
#tabs .tl{touch-action:pan-x;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}#tabs .tl.drag{cursor:grabbing}
#tabs .tl button{white-space:nowrap;flex:none}
#tabs .tside{flex:none;display:flex;align-items:center;gap:.5rem;padding-bottom:1px}
#tabs .seg.phase{flex-wrap:nowrap;padding:2px;border-radius:10px}
#tabs .seg.phase button{min-height:36px;height:36px;padding:0 .75rem;display:inline-flex;align-items:center;justify-content:center;gap:.4rem;line-height:1;font-size:.95rem;white-space:nowrap}
#tabs .seg.phase button{border-radius:8px}
#tabs.more .seg.phase .pl{display:none}
#tabs.more .tl button{padding-inline:.8rem}
.pop .pnote{margin:0 0 .4rem;font-weight:700}
@media (max-width:1000px){#tabs .seg.phase .pl{display:none}#tabs .seg.phase button{padding:0 .7rem;font-size:1.05rem}}
@media (max-width:640px){#tabs .tbar{gap:.5rem}}

/* surfaces: softer hairlines, a touch more air */
.box{border-color:color-mix(in srgb,var(--line) 85%,transparent);padding:1.1rem 1.2rem}
.stack{gap:1.25rem}.cols,.grid2,.grid3{gap:1.25rem}
.kpis,.sb-tiles{border-color:color-mix(in srgb,var(--line) 85%,transparent)}

/* "choose one" segmented control: selection is neutral (bone), red stays for primary actions and problems */
.seg button[aria-pressed=true]{background:var(--text);color:var(--panel)}
#top .seg button[aria-pressed=true]{background:var(--barink);color:#111}
input[type=range]{accent-color:var(--text)}
.seg.phase{border-radius:12px;padding:3px}
.seg.phase button{border-radius:9px;min-height:38px;padding:.3rem .85rem}
.seg.phase button:not([aria-pressed=true]):hover{background:color-mix(in srgb,var(--text) 8%,transparent)}
.seg.phase button[aria-pressed=true]{background:var(--text);color:var(--panel)}
.now{padding-bottom:1rem;margin-bottom:1.25rem}
.now .msg{font-size:1rem}

/* notices: a hairline box with a coloured edge, not a thick frame */
.banner{border-width:1px;border-color:var(--line2);border-left:3px solid var(--text);background:var(--panel2);padding:.6rem .9rem}
.banner.bad{border-color:color-mix(in srgb,var(--danger) 55%,var(--line2));border-left-color:var(--danger);background:color-mix(in srgb,var(--danger) 9%,var(--panel2))}
.intro{border-color:var(--line2)}
.steps>li::before{width:1.75rem;height:1.75rem;border-width:1.5px;font-family:var(--num);font-size:.85rem}
.hsteps>li{padding-left:2.6rem;min-height:3.6rem}

/* home: the mark, one question, two big doors */
.home{max-width:44rem;padding-top:1.5rem}
.who{gap:1rem;margin-bottom:1.75rem}
.who-c{position:relative;padding:1.25rem 1.35rem 1.3rem;min-height:9.5rem;gap:.55rem}
.who-c svg{width:30px;height:30px;color:var(--muted)}
.who-c h3{font-size:1.55rem;border:0;padding:0}
.who-c span{color:var(--muted)}
.who-c:hover{border-color:var(--line2);background:color-mix(in srgb,var(--text) 4%,var(--panel2))}
.who-c:hover svg,.who-c[aria-pressed=true] svg{color:var(--text)}
.who-c[aria-pressed=true]{border-color:var(--text);box-shadow:none}
.who-c[aria-pressed=true]::after{content:"✓";position:absolute;top:1rem;right:1rem;width:1.6rem;height:1.6rem;border-radius:50%;background:var(--text);color:var(--panel);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.85rem}
/* home: the picked role's shortcuts, one row per thing to do */
.hmenu{background:var(--panel2);border:1px solid color-mix(in srgb,var(--line) 85%,transparent);border-radius:var(--r);overflow:hidden}
.hmenu button{display:flex;align-items:center;gap:1rem;width:100%;text-align:left;background:none;border:0;border-top:1px solid color-mix(in srgb,var(--line) 80%,transparent);color:var(--text);padding:.9rem 1.2rem;min-height:4rem;font:inherit}
.hmenu button:first-child{border-top:0}
.hmenu button:hover{background:color-mix(in srgb,var(--text) 5%,transparent)}
.hmenu button>span{flex:1;display:flex;flex-direction:column;gap:.15rem}
.hmenu b{font-size:1.1rem}.hmenu button>span>span{color:var(--muted)}
.hmenu i{font-style:normal;font-size:1.6rem;line-height:1;color:var(--muted)}
.hmenu button:hover i{color:var(--text)}
/* crows: a card per crow — name, background, Stamina bar, one stat line */
.hcards{grid-template-columns:repeat(auto-fill,minmax(min(100%,19rem),1fr));gap:1rem}
.hcard{gap:.35rem;padding:1.1rem 1.2rem 1rem}
.hcard:hover{border-color:var(--line2);background:color-mix(in srgb,var(--text) 4%,var(--panel2))}
.hc-top{display:flex;align-items:baseline;justify-content:space-between;gap:.5rem}
.hcard h3{font-size:1.45rem;text-transform:none;letter-spacing:0;border:0;padding:0;flex:none}
.hbar{display:block;height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin:.5rem 0 .35rem}
.hbar i{display:block;height:100%;background:var(--text)}
.hstats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.25rem}
.hst{display:flex;flex-direction:column;gap:.05rem}
.hst small{font-size:.66rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hst b{font-family:var(--num);font-weight:600;font-variant-numeric:lining-nums tabular-nums;font-size:1.05rem}
.hst.bad b{color:var(--bad)}
.hnew{align-items:center;justify-content:center;min-height:9rem;border-style:dashed;background:none;color:var(--muted);font-weight:700}
.hnew .plus{font-size:1.8rem;line-height:1;font-weight:400}
.hnew:hover{color:var(--text)}
main>.page.solo{padding-top:1.5rem}

/* inventory: one status line, the manual folded away, slots quiet until you need them */
.slot{border:1.5px dashed color-mix(in srgb,var(--line2) 70%,transparent);background:none;border-radius:12px}
.slot:not(.empty):not(.span):not(.wounded){border-style:solid;border-color:transparent;background:color-mix(in srgb,var(--text) 3%,transparent)}
.slot .num{font-family:var(--num);font-size:.68rem;letter-spacing:.04em;top:.2rem}
.slot.empty{color:var(--faint)}
.slot.empty .plus{font-size:1.4rem;font-weight:300}
.slot.empty:hover{border-color:var(--line2);background:color-mix(in srgb,var(--text) 3%,transparent)}
.slot.wounded{border:1.5px solid var(--danger)}
.slot .wbtn{background:none;border-color:var(--line);font-weight:600;transition:background-color var(--ease),border-color var(--ease),color var(--ease)}
.slot .wbtn:not([aria-pressed=true]):hover{border-color:var(--line2);color:var(--text)}
.pool{border:1px solid var(--line2);border-style:solid;background:var(--panel2);padding:.9rem 1.1rem}
.pool h3{margin:0}

/* paper cards: same paper, quieter rule links, softer edges */
.card{border-radius:10px;border-top-width:4px;box-shadow:0 1px 0 var(--paper-line),0 6px 16px -6px rgba(0,0,0,.55);padding:.6rem .7rem .55rem;transition:box-shadow var(--ease),transform var(--ease)}
.slot>.card:hover{transform:translateY(-1px);box-shadow:0 1px 0 var(--paper-line),0 10px 22px -8px rgba(0,0,0,.65)}
.card .term{text-decoration-style:dotted;text-decoration-thickness:1px;text-decoration-color:var(--ink-muted);text-underline-offset:3px}
.card .term:hover{text-decoration-color:var(--ink)}
.card .catl{letter-spacing:.1em;font-size:.66rem}
.card .meta{border-radius:4px}
.card .acts button{background:transparent;transition:background-color var(--ease),border-color var(--ease)}
.card .acts button:not([aria-pressed=true]):hover{background:#fff;border-color:var(--ink-muted)}
.card .info{width:26px;height:26px;background:transparent;font-size:.85rem;transition:background-color var(--ease)}
.card .info:hover{background:#fff}

/* look up: a quiet category rail, a list that stays put, the entry as the one card */
.lib{grid-template-columns:12rem minmax(0,1fr);gap:1.5rem}
.libnav{background:none;border:0;padding:0;position:sticky;top:4.5rem;container-type:normal} /* its buttons size by the page, not by the rail */
.libnav h3{margin:.25rem .6rem .35rem;font-size:.7rem;letter-spacing:.1em}
.libnav h3:not(:first-child){margin-top:1.25rem}
