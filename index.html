<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon_x32.png">
<link rel="icon" type="image/png" sizes="64x64" href="icons/icon_x64.png">
<link rel="apple-touch-icon" href="icons/icon_x256.png">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0c0c0c">
<title>CROW NEST</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Alegreya:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --fs:18px;
  --shell:#161616; --panel:#0e0e0e; --panel2:#1a1a1a; --line:#2c2c2c; --line2:#474747;
  --text:#e9e7e3; --muted:#a6a39e; --faint:#77746f;
  --accent:#9b3b39; --accent-ink:#fff; --link:#f4f2ee; --ok:#bdbab4; --warn:#bdbab4;
  --paper:#e9e7e3; --paper2:#d8d5cf; --ink:#121212; --ink-muted:#55524d; --paper-line:#b9b5ad;
  --sel:#b4605a; --shadow:0 6px 22px rgba(0,0,0,.6);
  --body:'Atkinson Hyperlegible',system-ui,sans-serif; --display:'Alegreya',Georgia,serif;
  --r:12px;
  --bar:#000; --bar2:#1c1c1c; --barline:#383838; --barink:#e9e7e3;
}
:root{color-scheme:dark}:root[data-theme=light]{color-scheme:light}
:root[data-theme=light]{--shell:#d6d4cf;--panel:#f3f2ef;--panel2:#e6e4df;--line:#c3c0b9;--line2:#9e9a92;--text:#111;--muted:#46443f;--faint:#67645e;--link:#111;--sel:#8e3b37;--ok:#46443f;--warn:#46443f;--shadow:0 6px 20px rgba(0,0,0,.18)}
:root[data-theme=contrast]{--shell:#000;--panel:#000;--panel2:#0b0b0b;--line:#fff;--line2:#fff;--text:#fff;--muted:#fff;--faint:#ddd;--accent:#ff3b3b;--link:#fff;--sel:#ff3b3b;--ok:#fff;--warn:#fff;--paper:#fff;--paper2:#fff;--ink:#000;--ink-muted:#000;--paper-line:#000}
:root[data-font=system]{--body:system-ui,sans-serif;--display:system-ui,sans-serif}
*{box-sizing:border-box}
html{font-size:var(--fs)}
body{margin:0;background:var(--shell);color:var(--text);font:1rem/1.5 var(--body);-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--link);text-underline-offset:3px;text-decoration-color:var(--accent)}
:focus-visible{outline:3px solid var(--sel);outline-offset:2px}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0}
.muted{color:var(--muted)} .small{font-size:.85rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- top bar ---------- */
#top{position:sticky;top:0;z-index:30;background:var(--bar);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:.75rem;padding:.5rem 1rem;flex-wrap:wrap}
:root[data-theme=light] #top{background:#111;color:#e9e7e3}
.brand{font-family:var(--display);font-weight:800;font-size:1.25rem;letter-spacing:.06em;color:var(--barink);display:flex;align-items:center;gap:.5rem}
.brand svg{width:26px;height:26px}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--bar2);border:1px solid var(--barline);border-radius:999px;padding:3px}
.seg button{border:0;background:none;color:#cfccc6;padding:.35rem .9rem;border-radius:999px;font-weight:700;min-height:40px}
.seg button[aria-pressed=true]{background:var(--accent);color:#fff}
.spacer{flex:1}
.tbtn{background:var(--bar2);border:1px solid var(--barline);color:var(--barink);border-radius:10px;padding:.35rem .8rem;min-height:44px;display:inline-flex;align-items:center;gap:.4rem;font-weight:700}
.tbtn:hover{border-color:#777}
.dtchip{display:inline-flex;align-items:center;gap:.5rem;background:var(--bar2);border:1px solid var(--barline);border-radius:10px;padding:.3rem .7rem;color:var(--barink);min-height:44px}
.dtchip b{font-family:var(--display);font-size:1.15rem}
.dtchip .bar{width:70px;height:6px;border-radius:3px;background:var(--barline);overflow:hidden}
.dtchip .bar i{display:block;height:100%;background:var(--warn)}
.dtchip.idle{opacity:.7}
#tabs{display:flex;gap:.25rem;padding:.6rem 1rem 0;max-width:1500px;margin:0 auto;flex-wrap:wrap}
#tabs button{border:1px solid transparent;background:none;color:var(--muted);padding:.5rem 1rem;border-radius:10px 10px 0 0;font-weight:700;min-height:44px}
#tabs button[aria-selected=true]{background:var(--panel);color:var(--text);border-color:var(--line);border-bottom-color:var(--panel)}
main{max-width:1500px;margin:0 auto;padding:0 1rem 4rem}
.page{background:var(--panel);border:1px solid var(--line);border-radius:0 var(--r) var(--r) var(--r);padding:1.25rem}

/* ---------- generic blocks (Forge Steel-like) ---------- */
.box{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:1rem}
.box>h2,.sec-h{font-size:1.2rem;letter-spacing:.04em;text-transform:uppercase;font-family:var(--display);padding-bottom:.4rem;margin-bottom:.75rem;border-bottom:3px solid var(--line2)}
.sec-h{display:flex;align-items:baseline;gap:.75rem;flex-wrap:wrap}
.sec-h .muted{text-transform:none;letter-spacing:0;font-family:var(--body);font-size:.85rem;font-weight:400}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1rem}
.cols{display:grid;grid-template-columns:minmax(0,2fr) minmax(280px,1fr);gap:1rem;align-items:start}
@media (max-width:980px){.cols,.grid2{grid-template-columns:1fr}}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(6.5rem,1fr));gap:.5rem}
.tile{background:#070707;border:1px solid var(--line);border-radius:10px;padding:.45rem .6rem;text-align:center;min-height:72px;display:flex;flex-direction:column;justify-content:flex-start;align-items:center}
:root[data-theme=light] .tile{background:#fff}
.tile .k{margin-bottom:.35rem;font-size:.78rem;color:var(--muted);font-weight:700;letter-spacing:.03em}
.tile .v{font-family:var(--display);font-size:1.6rem;font-weight:800;line-height:1.1}
.tile .v small{font-size:.9rem;color:var(--muted);font-weight:500}
.tile.warn{border-color:var(--warn)} .tile.bad{border-color:var(--accent)}
.tile.btn{cursor:pointer} .tile.btn:hover{border-color:var(--line2)}
.stepper{display:inline-flex;align-items:center;gap:.25rem}
.stepper button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line2);background:var(--panel);font-weight:800;line-height:1}
.chips{display:flex;flex-wrap:wrap;gap:.35rem}
.chip{display:inline-flex;align-items:center;gap:.3rem;background:#2a2a2a;color:#e9e7e3;border-radius:6px;padding:.1rem .5rem;font-size:.85rem;font-weight:700}
:root[data-theme=light] .chip{background:#d6d3cd;color:#121212}
.chip.on{background:var(--accent);color:#fff}
.chip button{border:0;background:none;padding:0 .1rem;font-weight:800}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;border:1px solid var(--line2);background:var(--panel2);border-radius:10px;padding:.45rem .9rem;min-height:44px;font-weight:700;text-decoration:none;color:var(--text)}
.btn:hover{border-color:var(--text)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{background:none}
.btn.sm{min-height:36px;padding:.25rem .65rem;font-size:.9rem}
.btn:disabled{opacity:.4;cursor:not-allowed;border-color:var(--line)}
.row{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:1rem}
input[type=number],input[type=text],input[type=search],select{background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:.4rem .6rem;min-height:44px}
input[type=number]{width:5.5rem}
/* every number field is [−] value [+]; the value stays typeable */
.numstep{display:inline-flex;align-items:stretch;flex:none;background:var(--panel);border:1px solid var(--line2);border-radius:10px;min-height:44px}
td.nw{white-space:nowrap}
td .numstep input[type=number]{width:2.6rem}td .stp{min-width:32px}
.row>select{max-width:100%;min-width:0}
.numstep:focus-within{border-color:var(--text)}
.numstep input[type=number]{border:0;background:none;border-radius:0;width:4rem;min-width:0;padding:.4rem .2rem;text-align:center;font-variant-numeric:lining-nums tabular-nums;appearance:textfield;-moz-appearance:textfield}
.numstep input::-webkit-inner-spin-button,.numstep input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.numstep input:focus-visible{outline:0}
.stp{border:0;background:none;min-width:40px;font-size:1.2rem;font-weight:700;line-height:1;color:var(--muted);cursor:pointer;border-radius:9px}
.stp:hover{color:var(--text);background:var(--panel2)}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent)}
label.check{display:inline-flex;align-items:center;gap:.5rem;min-height:44px;cursor:pointer}
.trait{margin:.35rem 0}.trait b{font-weight:700}
.note{border-left:4px solid var(--line2);padding:.4rem .8rem;color:var(--muted);background:var(--panel2);border-radius:0 8px 8px 0}
table.rt{width:100%;border-collapse:collapse;margin:.5rem 0}
table.rt th,table.rt td{border-bottom:1px solid var(--line);padding:.4rem .5rem;text-align:left;vertical-align:top}
table.rt th{font-size:.85rem;color:var(--muted)}
table.rt tr.hit td{background:color-mix(in srgb,var(--sel) 22%,transparent);font-weight:700}
.term{color:inherit;text-decoration:underline dotted;text-decoration-color:var(--link);text-decoration-thickness:2px;text-underline-offset:4px;cursor:help}
.term:hover{color:var(--link)}

/* ---------- power roll table (Forge Steel style) ---------- */
.pr{border:1px solid var(--line2);border-radius:10px;overflow:hidden;margin:.5rem 0;background:var(--panel)}
.pr .h{padding:.4rem .75rem;font-weight:700;border-bottom:1px solid var(--line2);display:flex;gap:.6rem;align-items:baseline;flex-wrap:wrap}
.pr .h .muted{font-weight:400;font-size:.85rem}
.pr .r{display:grid;grid-template-columns:4.2rem 1fr;align-items:baseline}
.pr .r + .r{border-top:1px solid var(--line)}
.pr .t{padding:.4rem .6rem;font-weight:800;font-family:var(--display);font-size:1.05rem;border-right:1px solid var(--line2);text-align:center}
.pr .x{padding:.4rem .75rem}
.pr .x .dice{display:block;font-size:.8rem;color:var(--muted)}
.pr .r.on{background:color-mix(in srgb,var(--sel) 20%,transparent)}
.pr .r.on .t{color:var(--sel)}
.pr .r.dim{opacity:.45}

/* ---------- inventory board ---------- */
.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.6rem}
.board .lab{grid-column:1/-1;display:flex;align-items:baseline;gap:.75rem;margin-top:.5rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:.95rem}
.board .lab .muted{text-transform:none;letter-spacing:0;font-weight:400;font-size:.85rem}
.board .grp{display:grid;grid-template-columns:subgrid;gap:inherit;align-content:start}.board .g2{grid-column:span 2}.board .g3{grid-column:span 3}
.slot{position:relative;min-height:15.5rem;padding-top:1.15rem;border:2px dashed var(--line2);border-radius:12px;background:rgba(0,0,0,.18);display:flex;flex-direction:column}
.slot .num{position:absolute;top:.1rem;left:.5rem;font-size:.75rem;color:var(--faint);font-weight:700;z-index:2}
.slot.empty{align-items:center;justify-content:center;color:var(--muted);cursor:pointer}
.slot.empty:hover{border-color:var(--text);color:var(--text)}
.slot.empty .plus{font-size:1.6rem;line-height:1}
.slot.target{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,transparent)}
.slot.drop-hover{outline:3px solid var(--ok);outline-offset:2px}
.slot.nope{opacity:.45}
.slot>.card.moving{outline:3px solid var(--ok);outline-offset:2px}
.slot.span{border-style:solid}
.slot.wounded{border-color:var(--accent)}
.slot .wbtn{margin:auto .35rem .35rem;border:1px solid var(--line2);background:var(--panel);border-radius:8px;font-size:.8rem;font-weight:700;min-height:34px;color:var(--muted)}
.slot .wbtn[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.slot .wbtn.pending{border-color:var(--accent);color:var(--text);animation:pulse 1s infinite alternate}
@keyframes pulse{to{box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 45%,transparent)}}
.cont{flex:1;display:flex;align-items:center;justify-content:center;padding:.5rem;color:var(--ink-muted);font-family:var(--display);font-weight:700;text-align:center;background:repeating-linear-gradient(135deg,transparent 0 8px,rgba(255,255,255,.04) 8px 16px);border-radius:10px;margin:.3rem}

/* ---------- item card (paper) ---------- */
.card{background:var(--paper);color:var(--ink);border-radius:10px;box-shadow:0 2px 0 var(--paper-line),0 3px 12px rgba(0,0,0,.35);padding:.55rem .65rem .5rem;display:flex;flex-direction:column;gap:.25rem;position:relative;font-size:.86rem;line-height:1.35;border-top:6px solid var(--cat,#8a7b62)}
.card a,.card .term{color:var(--ink)} .card .term{text-decoration-color:var(--accent)}
.card .nm{font-family:var(--display);font-weight:800;font-size:1.08rem;line-height:1.15;padding-right:1.6rem}
.card .meta{display:flex;justify-content:space-between;gap:.4rem;background:var(--paper2);border-radius:5px;padding:.1rem .4rem;font-size:.78rem;font-weight:700}
.card .ln{font-size:.82rem}
.card .ln b{font-weight:700}
.card .q{font-style:italic}
.card .txt{overflow:hidden;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical}
.card.full .txt{display:block;-webkit-line-clamp:unset}
.card .tt{display:grid;border:1px solid var(--paper-line);border-radius:5px;overflow:hidden;font-size:.8rem;text-align:center}
.card .tt div{padding:.08rem .2rem}
.card .tt .th{background:var(--paper2);font-weight:800}
.card .price{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-size:.78rem;color:var(--ink-muted);font-weight:700;gap:.3rem}
.card .catl{font-size:.7rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted)}
.card .acts{display:flex;flex-wrap:wrap;gap:.25rem;margin-top:.15rem}
.card .acts button{border:1px solid var(--paper-line);background:#f6f5f2;color:var(--ink);border-radius:6px;font-size:.78rem;font-weight:700;min-height:30px;padding:0 .45rem}
.card .acts button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.card .pips{display:inline-flex;gap:3px;align-items:center}
.card .pip{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--ink);background:#fff;padding:0}
.card .pip.gone{background:transparent;border-style:dashed;opacity:.4}
.card .info{position:absolute;top:.35rem;right:.35rem;width:28px;height:28px;border-radius:50%;border:1px solid var(--paper-line);background:#f6f5f2;color:var(--ink);font-weight:800;font-family:var(--display);line-height:1}
.card .badge{position:absolute;top:-.55rem;left:.5rem;background:var(--accent);color:#fff;border-radius:6px;padding:0 .4rem;font-size:.72rem;font-weight:800}
.slot>.card{flex:1;margin:.25rem;cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none}
body.is-dragging,body.is-dragging *{-webkit-user-select:none;user-select:none;cursor:grabbing!important}
.slot>.card.lit{box-shadow:0 0 0 2px #f4f2ee,0 0 18px rgba(255,255,255,.35)}
.card.ghost{position:fixed;pointer-events:none;z-index:100;opacity:.92;transform:rotate(-2deg);width:12rem;box-shadow:var(--shadow)}
.card.dragging{opacity:.35}
.card{--cat:#141414}.c-weapon,.c-ammo{--cat:var(--accent)}
#preview{position:fixed;z-index:60;width:20rem;pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s}
#preview.on{opacity:1;transform:none}
#preview .card{font-size:.95rem}

/* ---------- pool ---------- */
.pool{border:2px dashed var(--ok);border-radius:var(--r);padding:.75rem;min-height:8rem;background:color-mix(in srgb,var(--ok) 6%,transparent)}
.pool.drop-hover,.pooldrop.drop-hover{outline:3px solid var(--ok)}
.pooldrop{border-color:var(--ok);border-style:dashed;min-height:auto}
.pool h3{font-family:var(--body);font-size:.95rem;text-transform:uppercase;letter-spacing:.06em}
.prow{display:flex;gap:.5rem;align-items:center;padding:.45rem 0;border-top:1px solid var(--line)}
.prow .nm{flex:1;min-width:0}
.prow .nm b{display:block;font-family:var(--display);font-size:1.05rem}
.prow .nm span{font-size:.8rem;color:var(--muted)}
.xbtn{width:36px;height:36px;border-radius:8px;border:1px solid var(--line2);background:none;font-weight:800;color:var(--muted)}
.xbtn:hover{color:var(--accent);border-color:var(--accent)}

/* ---------- banners, popovers, panel ---------- */
.banner{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;border:2px solid var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--panel));border-radius:var(--r);padding:.5rem .75rem;margin-bottom:.75rem}
.banner .msg{flex:1;min-width:12rem}
.banner.bad{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--panel))}
.pop{position:fixed;z-index:70;max-width:min(24rem,92vw);background:var(--panel);color:var(--text);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow);padding:.75rem .9rem;font-size:.95rem}
.pop h4{margin:0 0 .25rem;font-family:var(--display);font-size:1.1rem}
.pop .foot{margin-top:.5rem;display:flex;justify-content:space-between;gap:.5rem;align-items:center}
.pop .foot a{font-weight:700}
#searchPop{position:fixed;z-index:75;width:min(26rem,94vw);background:var(--panel);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow);padding:.6rem;display:none}
#searchPop.on{display:block}
#spl li button span{white-space:nowrap;max-width:none}
.combo input{width:100%}
.lb{list-style:none;margin:.4rem 0 0;padding:0;max-height:22rem;overflow:auto}
.lb .gh{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:.4rem .5rem .1rem;font-weight:700}
.lb li[role=option]{padding:.45rem .55rem;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;gap:.5rem}
.lb li[role=option] small{color:var(--muted)}
.lb li[aria-selected=true],.lb li[role=option]:hover{background:var(--panel2);outline:1px solid var(--line2)}
.lb mark{background:none;color:var(--link);font-weight:800}
#panel{position:fixed;top:0;right:0;bottom:0;width:min(31rem,100vw);background:var(--panel);border-left:1px solid var(--line2);z-index:50;transform:translateX(102%);transition:transform .2s;display:flex;flex-direction:column;box-shadow:var(--shadow)}
body.panel-open #panel{transform:none}
@media (min-width:1500px){body.panel-open main{margin-right:31rem}}
#panel .ph{display:flex;align-items:center;gap:.4rem;padding:.5rem;border-bottom:1px solid var(--line)}
#panel .ph h2{flex:1;font-size:1.15rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ibtn{width:44px;height:44px;border-radius:10px;border:1px solid var(--line2);background:var(--panel2);font-weight:800;font-size:1.1rem;display:inline-flex;align-items:center;justify-content:center;color:var(--text);text-decoration:none}
.ibtn:disabled{opacity:.3;cursor:not-allowed;background:none}
#panel .pb{padding:1rem;overflow:auto;flex:1}
.backlink{display:inline-flex;align-items:center;gap:.4rem;margin-bottom:.75rem;border:1px solid var(--line2);background:var(--panel2);border-radius:999px;padding:.3rem .8rem;font-weight:700;min-height:40px;color:var(--text)}
.rel{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.75rem}
.rel a{border:1px solid var(--line2);border-radius:999px;padding:.2rem .7rem;text-decoration:none;font-weight:700;font-size:.9rem}
.list-links{list-style:none;padding:0;margin:.25rem 0}
.list-links li{border-bottom:1px solid var(--line)}
.list-links a{display:flex;justify-content:space-between;padding:.45rem .25rem;text-decoration:none;font-weight:700}
.list-links a span{color:var(--muted);font-weight:400;font-size:.85rem}
#toast{position:fixed;left:50%;bottom:1.25rem;transform:translate(-50%,150%);background:var(--text);color:var(--panel);font-weight:700;padding:.65rem 1.1rem;border-radius:12px;z-index:90;transition:transform .2s;max-width:92vw}
#toast.on{transform:translate(-50%,0)}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line2);border-radius:var(--r);padding:1.1rem;max-width:min(32rem,94vw);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(0,0,0,.55)}

/* ---------- statblock ---------- */
.sb-head{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-left:6px solid var(--accent);border-radius:10px;padding:.6rem .8rem;display:flex;justify-content:space-between;gap:.5rem;align-items:center;margin:.5rem 0}
.sb-head .chip{background:#2a2a2a;color:var(--text)}

/* ---------- design pass: one type scale, flat page, quiet chrome ---------- */
/* Numbers: body font with lining, tabular figures, so values never sit at different heights or change width. */
body{font-variant-numeric:lining-nums}
.tile .v,.pr .t,.roll,.clock,.dtchip b,.dtchip span,.dice6 button,.kpi .v{font-family:var(--body);font-variant-numeric:lining-nums tabular-nums}
.clock{font-weight:700;letter-spacing:-.01em}
/* One container level: the page is the canvas, boxes are the only cards. Tabs are underline tabs. */
.page,.page.solo{background:none;border:0;border-radius:0;padding:1.25rem 0 0;margin-top:0}
#tabs{gap:0;padding:0;border-bottom:1px solid var(--line);margin:.5rem auto 0;width:calc(100% - 2rem);max-width:calc(1500px - 2rem)}
#tabs button,#tabs button[aria-selected=true]{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;margin-bottom:-1px;padding:.6rem 1.1rem}
#tabs button:hover{color:var(--text)}
#tabs button[aria-selected=true]{color:var(--text);border-bottom-color:var(--accent)}
/* Section headings: small caps label + hairline, the same everywhere. */
.box>h2,.sec-h{font-family:var(--body);font-size:.8rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--text);padding-bottom:.55rem;margin-bottom:.85rem;border-bottom:1px solid var(--line)}
.sec-h.sm{font-size:.75rem;margin-top:1.1rem}

.pool h3{font-size:.8rem;letter-spacing:.09em}
.page h1{font-size:1.5rem}
.opt h3{text-transform:none;letter-spacing:0;font-size:1.2rem;border-bottom-width:1px;border-color:var(--line)}
/* Links inside lists and rows read as names, not as underlined body links. */
.prow .nm a,.list-links a,.board .lab>a{text-decoration:none}
.prow .nm a:hover,.list-links a:hover{text-decoration:underline}
/* Stat strips everywhere share the sheet's KPI look (characteristics, monster stats). */
button.kpi{border:0;font:inherit;color:inherit;cursor:pointer;background:transparent}
button.kpi:hover .m{color:var(--text)}
button.kpi[aria-pressed=true]{box-shadow:inset 0 -2px 0 var(--accent),1px 0 0 var(--line),0 1px 0 var(--line)}
.sb-tiles{gap:0;background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}

.board .lab{font-size:.8rem;letter-spacing:.09em;margin-top:1rem}

.optgrid.sm{grid-template-columns:repeat(auto-fill,minmax(min(100%,9.5rem),1fr));gap:.5rem}

/* pets */
.petslots{display:grid;grid-template-columns:repeat(auto-fill,minmax(9rem,1fr));gap:.6rem}
.sec-h.sm{margin-top:1rem}
.slot>.card{min-height:0;overflow:hidden}
.slot>.card .txt{-webkit-line-clamp:4}
@media (max-width:640px){.slot{aspect-ratio:auto;min-height:13rem}.slot.wide::before{display:none}}
</style>
</head>
<body>
<header id="top">
  <button class="brand" data-action="go" data-v="home" aria-label="Home"><img src="icons/icon_x64.png" width="30" height="30" alt=""></button>
  <h1 id="ptl"></h1>
  <span class="spacer"></span>
  <span id="dtchip"></span>
  <span id="acts" class="row"></span>
</header>
<nav id="tabs" role="tablist" hidden></nav>
<main id="main"></main>
<aside id="panel" aria-label="Details">
  <div class="ph"><button class="ibtn" data-action="pback" aria-label="Back">‹</button><button class="ibtn" data-action="pfwd" aria-label="Forward">›</button><h2 id="ptitle"></h2><a class="ibtn" id="pnew" target="_blank" aria-label="Open in new tab">↗</a><button class="ibtn" data-action="pclose" aria-label="Close">✕</button></div>
  <div class="pb" id="pbody"></div>
</aside>
<div id="preview" aria-hidden="true"></div>
<div id="searchPop" role="dialog" aria-label="Add item"></div>
<div id="pops"></div>
<nav id="nav" aria-label="Sections">
  <div class="navg"><button data-action="go" data-v="home" aria-label="Home"><img src="icons/icon_x64.png" width="30" height="30" alt=""></button><button data-action="go" data-v="crows"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/></svg>Crows</button><button data-action="go" data-v="library"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>Library</button><button data-action="go" data-v="session"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m10 8 6 4-6 4z"/></svg>Session</button></div>
  <span class="spacer"></span>
  <div class="navg dark"><button id="netbtn" data-state="off" aria-label="Shared table"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19.5" r="1"/></svg><span class="lbl">Table</span></button><button data-action="rules-index"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>Rules</button><button data-action="settings" aria-label="Display settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7V4h16v3M9 20h6M12 4v16"/></svg>Display</button></div>
</nav>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="dlg"></dialog>
<script src="data.js"></script>
<script src="rules.js"></script>
<script src="app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script src="sync.js"></script>
</body>
</html>
